name: CI/CD Pipeline - Maven Build and Tomcat Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate
        run: mvn validate

      - name: Compile
        run: mvn compile

      - name: Test
        run: mvn test

      - name: Package WAR
        run: mvn clean package

      - name: Verify WAR
        run: ls -lh target/*.war

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: artifact

      - name: Deploy to DEV
        env:
          URL: ${{ secrets.TOMCAT_URL_DEV }}
          USER: ${{ secrets.TOMCAT_USER_DEV }}
          PASS: ${{ secrets.TOMCAT_PASSWORD_DEV }}
        run: |
          WAR_FILE=$(find artifact -name "*.war" | head -1)

          curl --fail \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/file-upload-url-generator&update=true"

  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: TEST
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: artifact

      - name: Deploy to TEST
        env:
          URL: ${{ secrets.TOMCAT_URL_TEST }}
          USER: ${{ secrets.TOMCAT_USER_TEST }}
          PASS: ${{ secrets.TOMCAT_PASSWORD_TEST }}
        run: |
          WAR_FILE=$(find artifact -name "*.war" | head -1)

          curl --fail \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/file-upload-url-generator&update=true"

  deploy-preprod:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: PREPROD
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: artifact

      - name: Deploy to PREPROD
        env:
          URL: ${{ secrets.TOMCAT_URL_PREPROD }}
          USER: ${{ secrets.TOMCAT_USER_PREPROD }}
          PASS: ${{ secrets.TOMCAT_PASSWORD_PREPROD }}
        run: |
          WAR_FILE=$(find artifact -name "*.war" | head -1)

          curl --fail \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/file-upload-url-generator&update=true"

  deploy-prod:
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: artifact

      - name: Deploy to PROD
        env:
          URL: ${{ secrets.TOMCAT_URL_PROD }}
          USER: ${{ secrets.TOMCAT_USER_PROD }}
          PASS: ${{ secrets.TOMCAT_PASSWORD_PROD }}
        run: |
          WAR_FILE=$(find artifact -name "*.war" | head -1)

          curl --fail \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/file-upload-url-generator&update=true"
